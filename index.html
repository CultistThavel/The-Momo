function ovUpd(){cam.updateMatrixWorld();cam.matrixWorldInverse.getInverse(cam.matrixWorld);const W=innerWidth,H=innerHeight;
 OV.forEach(o=>{const el=o.el;if(o.off)return;o.p.updateMatrixWorld(true);
  const P=[[-.5,.5],[.5,.5],[.5,-.5],[-.5,-.5]].map(([x,y])=>o.p.localToWorld(new T.Vector3(x,y,0)));
  const nv=new T.Vector3(0,0,1).applyQuaternion(o.g.quaternion);
  const ok=!HS.s&&nv.dot(cam.position.clone().sub(o.g.position))>0&&Math.abs(cam.position.y-o.g.position.y)<3.2&&cam.position.distanceTo(o.g.position)<9&&P.every(v=>v.clone().applyMatrix4(cam.matrixWorldInverse).z<-.1);
  if(!ok){el.style.display='none';return}
  const s=P.map(v=>{v.project(cam);return[(v.x+1)/2*W,(1-v.y)/2*H]});
  const[[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=s,dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1;
  if(Math.abs(den)<1e-6){el.style.display='none';return}
  const G=(dx3*dy2-dx2*dy3)/den,Hh=(dx1*dy3-dx3*dy1)/den,A=x1-x0+G*x1,B=x3-x0+Hh*x3,Dd=y1-y0+G*y1,E=y3-y0+Hh*y3;
  el.style.transform='matrix3d('+[A/100,Dd/100,0,G/100,B/100,E/100,0,Hh/100,0,0,1,0,x0,y0,0,1].join(',')+')';
  el.style.filter='brightness('+(DY.k?1:.5)+')';el.style.display='block'})}

  if(armed&&mode==='off'){
   const box=!!document.querySelector('.v7box');if(box)seen=true;
   if((seen&&!box)||nightT>=18){armed=false;spawn(false)}}}

 const P=pinfo();ascT=Math.max(0,ascT-dt);cd=Math.max(0,cd-dt);moving=false;
 if(mode==='patrol'){
  if(wait>0){wait-=dt;if(wait<=0)pick(P)}
  else{const d=tgt-s;if(Math.abs(d)<.25)wait=1.2+Math.random()*2.6;else{dirSign=d>0?1:-1;step(dt,PAT)}}
  if(!P.hid&&!P.trans&&cd<=0&&detect(P))notice();
 }else if(mode==='search'){
  const d=tgt-s;
  if(Math.abs(d)>.3){dirSign=d>0?1:-1;step(dt,SRC)}else{searchT+=dt;if(searchT>3.5){mode='patrol';wait=.6;cd=2}}
  if(mode==='search'&&!P.hid&&!P.trans&&cd<=0&&detect(P))notice();

  if(!CM)chaseOn();
  if(P.hid)toSearch();
  else{
   const ps=projS(P.x,P.z,P.y);lastPs=ps;tgt=ps;const d=ps-s;

}// ===== v11: предупреждение о бета-версии (мел + пыль) =====
(function(){
 const TOP='calc(env(safe-area-inset-top,0px) + 6px)'; // отступ сверху, если надо ниже, поменяй тут
 const W=640,FS=30,LH=42,PAD=26,MAXW=W-PAD*2;
 const FF='"Marker Felt","Comic Sans MS",cursive';
 const words=['ВАРН','-','ИГРА','НАХОДИТСЯ','В','БЕТА','ВЕРСИИ,','ПОЭТОМУ','МОГУТ','ПРИСУТСТВОВАТЬ','БАГИ.','В','БУДУЩЕМ','ИГРА','СТАНЕТ','ЛУЧШЕ!'];
 const font='bold '+FS+'px '+FF;

 // раскладка по строкам
 const tmp=document.createElement('canvas').getContext('2d');tmp.font=font;
 const sp_=tmp.measureText(' ').width;
 const lines=[];let cur=[],cw=0;
 words.forEach((w,i)=>{
  const ww=tmp.measureText(w).width;
  if(cur.length&&cw+sp_+ww>MAXW){lines.push({it:cur,w:cw});cur=[];cw=0}
  cur.push({t:w,w:ww,red:i===0});cw+=(cur.length>1?sp_:0)+ww});
 lines.push({it:cur,w:cw});

 const H=lines.length*LH+PAD*2-10;
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const g=c.getContext('2d');
 let q=37;const r=()=>(q=q*16807%2147483647)/2147483647;

 g.font=font;g.textBaseline='middle';g.textAlign='left';
 lines.forEach((ln,li)=>{
  let x=(W-ln.w)/2;const y=PAD+li*LH+LH/2-5;
  ln.it.forEach(w=>{
   const col=w.red?'#ff2a2a':'#ffffff';
   g.shadowColor=w.red?'rgba(255,60,60,.85)':'rgba(255,255,255,.7)';g.shadowBlur=8;
   g.fillStyle=col;g.strokeStyle=col;
   for(let i=0;i<4;i++){g.globalAlpha=.3+r()*.25;g.fillText(w.t,x+(r()-.5)*3,y+(r()-.5)*3)}
   g.lineWidth=1.5;
   for(let i=0;i<2;i++){g.globalAlpha=.4;g.strokeText(w.t,x+(r()-.5)*2,y+(r()-.5)*2)}
   x+=w.w+sp_})});
 g.shadowBlur=0;

 // пыль вокруг и по тексту
 g.fillStyle='#fff';
 for(let i=0;i<420;i++){g.globalAlpha=r()*.5;const s=r()*2+.5;g.fillRect(r()*W,r()*H,s,s)}
 // «стёртые» мелком точки
 g.globalCompositeOperation='destination-out';
 for(let i=0;i<650;i++){g.globalAlpha=.7;g.fillRect(r()*W,r()*H,1+r()*2,1+r()*2)}
 g.globalCompositeOperation='source-over';g.globalAlpha=1;

 c.style.cssText='position:fixed;left:50%;top:'+TOP+';width:min(94vw,460px);height:auto;margin-left:calc(min(94vw,460px)/-2);z-index:20;pointer-events:none;opacity:0;filter:drop-shadow(0 0 6px rgba(0,0,0,.9))';
 document.body.appendChild(c);

 // появление
 c.animate(
  [{opacity:0,transform:'translateY(-24px) scale(.85)'},{opacity:1,transform:'translateY(0) scale(1)'}],
  {duration:900,easing:'cubic-bezier(.2,.9,.3,1.15)',fill:'forwards'});

 // через 6 секунд быстро уходит вниз и пропадает
 setTimeout(()=>{
  const a=c.animate(
   [{opacity:1,transform:'translateY(0) scale(1)'},{opacity:0,transform:'translateY(60px) scale(.92)'}],
   {duration:350,easing:'ease-in',fill:'forwards'});
  a.onfinish=()=>c.remove();
 },6900); // 0.9с появление + 6с показа
})();
</script></body></html>
